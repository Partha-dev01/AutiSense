# Desktop (Electron) installer build + publish to GitHub Releases.
#
# Builds the self-contained Electron wrapper in ./electron with electron-builder
# and publishes the per-OS installers to the GitHub Release for the pushed tag:
#   - windows-latest -> NSIS .exe
#   - ubuntu-latest  -> .deb + .AppImage
#   - macos-latest   -> .dmg
# electron-builder auto-detects the runner OS and builds the targets configured
# in electron/electron-builder.yml, then uploads them to the release (it reads
# the publish: github block in that file).
#
# SECRETS
#   REQUIRED:
#     (none beyond the auto-provided GITHUB_TOKEN — used by electron-builder as GH_TOKEN)
#   OPTIONAL — code signing / notarization. If a secret is unset it is passed as
#   an empty string and electron-builder simply skips signing for that step.
#   Builds still SUCCEED unsigned.
#     CSC_LINK                    base64 or URL of the code-signing cert (.pfx win / .p12 mac)
#     CSC_KEY_PASSWORD            password for the cert above
#     APPLE_ID                    Apple ID email           (macOS notarization)
#     APPLE_APP_SPECIFIC_PASSWORD app-specific password    (macOS notarization)
#     APPLE_TEAM_ID               Apple Developer Team ID  (macOS notarization)
#
# NOTE: Unsigned Windows builds trigger SmartScreen warnings and unsigned/un-notarized
# macOS builds trigger Gatekeeper ("unidentified developer") warnings. Add the signing
# secrets above to remove them.

name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./electron
        run: npm ci

      - name: Build and publish installers
        working-directory: ./electron
        run: npx electron-builder --publish always
        env:
          # electron-builder reads GH_TOKEN to create/upload the GitHub Release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code-signing / notarization secrets (CSC_LINK, CSC_KEY_PASSWORD, APPLE_*)
          # are intentionally NOT passed. When the secrets are unset, GitHub injects an
          # EMPTY STRING, and electron-builder 25.x treats an empty CSC_LINK as a real
          # cert path -> resolves to the project dir -> crashes the macOS build with
          # "<dir> not a file" (upstream fix PR #8185 is not in v25.1.8). Omitting them
          # leaves CSC_LINK truly unset -> signing skipped -> unsigned .dmg builds fine.
          # To enable signing later: add the secrets AND re-add the env vars here.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # electron-builder's GitHub publisher SKIPS uploading to an already-PUBLISHED
      # release: the first run created + published v1.1.0, so every later re-run
      # silently no-ops the upload (the job still reports success). `gh release
      # upload --clobber` CAN write to a published release, so we upload the built
      # installers explicitly here. electron-builder still runs above to generate
      # the blockmaps + latest*.yml auto-update metadata. Tag pushes only
      # (workflow_dispatch has no release tag to upload to).
      #
      # NAMING: electron-builder produces files with SPACES ("AutiSense Setup
      # 1.1.0.exe"); its publisher uploads them with spaces->HYPHENS, but `gh
      # release upload` would use spaces->DOTS, creating a duplicate that
      # --clobber can't match (and latest.yml points at the hyphen name). So we
      # rename spaces->hyphens first, matching the publisher's convention, so
      # --clobber truly overwrites. (.dmg/.deb have no spaces and are unaffected.)
      - name: Upload installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: ./electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for f in dist/*\ *; do [ -e "$f" ] && mv -- "$f" "${f// /-}"; done
          files=(dist/*.exe dist/*.exe.blockmap dist/*.dmg dist/*.dmg.blockmap dist/*.AppImage dist/*.deb dist/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer artifacts found in dist/ to upload" >&2
            exit 1
          fi
          echo "Uploading to ${GITHUB_REF_NAME}: ${files[*]}"
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
