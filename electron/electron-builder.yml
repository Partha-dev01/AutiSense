appId: in.imaginaerium.autisense
productName: AutiSense
copyright: © AutiSense

directories:
  output: dist
  buildResources: build

# Thin wrapper: ship only the shell files — no Next assets, no model.
files:
  - main.js
  - preload.js
  - package.json

# Custom URL scheme used by the desktop OAuth hand-off (autisense://auth?...).
protocols:
  - name: AutiSense
    schemes:
      - autisense

# Self-update + release hosting from the GitHub repo's Releases.
publish:
  provider: github
  owner: Partha-dev01
  repo: AutiSense

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

linux:
  target:
    - deb
    - AppImage
  category: Education
  icon: build/icon.png

mac:
  target:
    - dmg
  category: public.app-category.education
  icon: build/icon.png
  # No paid Apple Developer cert, so AD-HOC sign (identity "-") instead of leaving
  # the app fully unsigned (identity null). A fully-unsigned app gets the hard
  # "App is damaged and can't be opened" Gatekeeper block on Apple Silicon; an
  # ad-hoc signature downgrades that to the bypassable "unidentified developer"
  # (right-click -> Open). Still NOT notarized, so users may need:
  #   xattr -cr /Applications/AutiSense.app   (documented in README + release notes)
  # We're on electron-builder 25.x, so the v26.0.13+ ad-hoc camera/mic regression
  # (#9529) does NOT apply. CSC_LINK is not passed by the workflow, so the empty-
  # cert-path "<dir> not a file" crash is already avoided independently of this.
  identity: "-"
