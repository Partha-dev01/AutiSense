appId: in.imaginaerium.autisense
productName: AutiSense
copyright: © AutiSense

directories:
  output: dist
  buildResources: build

# Thin wrapper: ship only the shell files — no Next assets, no model.
files:
  - main.js
  - preload.js
  - package.json

# Custom URL scheme used by the desktop OAuth hand-off (autisense://auth?...).
protocols:
  - name: AutiSense
    schemes:
      - autisense

# Self-update + release hosting from the GitHub repo's Releases.
publish:
  provider: github
  owner: Partha-dev01
  repo: AutiSense

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

linux:
  target:
    - deb
    - AppImage
  category: Education
  icon: build/icon.png

mac:
  target:
    - dmg
  category: public.app-category.education
  icon: build/icon.png
  # Build UNSIGNED: skip macOS code-signing identity lookup. Combined with NOT
  # passing an (empty) CSC_LINK env var in the workflow, this avoids the
  # electron-builder 25.x "<dir> not a file" crash on empty cert paths.
  identity: null
